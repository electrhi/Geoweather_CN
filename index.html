<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18231f" />
    <title>충남권 온열질환 관제</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQWoZbcw2ou48n4wPkaFhYFAzXdZjWs="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow">기상청 관측 · 고용노동부 기준</p>
            <h1>충남권 온열질환 관제</h1>
            <p class="subtitle">충남 시·군 / 대전 5개 구 / 세종시</p>
          </div>
          <button id="refreshButton" class="icon-button" type="button" title="새로고침" aria-label="새로고침">↻</button>
        </header>

        <section class="operator-bar" aria-label="작업자 설정">
          <label for="userIdInput">작업자</label>
          <input id="userIdInput" type="text" autocomplete="username" placeholder="user_id" />
          <button id="saveUserButton" type="button">저장</button>
        </section>

        <section class="push-card" aria-label="휴대폰 알림 설정">
          <div>
            <strong>온열질환 휴대폰 알림</strong>
            <span id="pushStatus">알림 상태를 확인하고 있습니다.</span>
          </div>
          <button id="pushButton" type="button">알림 받기</button>
        </section>

        <section class="threshold-guide" aria-label="고용노동부 체감온도 기준">
          <span><b class="dot caution"></b>33℃ 폭염주의</span>
          <span><b class="dot warning"></b>35℃ 폭염경보</span>
          <span><b class="dot danger"></b>38℃ 폭염중대경보</span>
        </section>

        <section class="status-strip" aria-live="polite">
          <div>
            <span>최근 관측</span>
            <strong id="lastUpdated">대기 중</strong>
          </div>
          <div>
            <span>주의 이상</span>
            <strong id="alertCount">0</strong>
          </div>
        </section>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>지역</th>
                <th>체감</th>
                <th>작업자</th>
              </tr>
            </thead>
            <tbody id="regionTable"></tbody>
          </table>
        </div>
      </aside>

      <section class="map-stage">
        <div id="map" aria-label="충남권 시군구별 체감온도 지도"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
  </body>
</html>
